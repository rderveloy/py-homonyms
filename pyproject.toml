[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-homonyms"
version = "0.1.0"
description = "A comprehensive library for checking homonyms, homophones, and homographs in English."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = ["cmudict>=1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["py_homonyms*"]
